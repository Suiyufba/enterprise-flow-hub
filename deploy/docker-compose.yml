services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DB_PATH: /data/efh.db
      UPLOAD_DIR: /data/uploads
      TZ: ${TZ:-Asia/Shanghai}
      AUTOMATION_TIMEZONE: ${AUTOMATION_TIMEZONE:-Asia/Shanghai}
      AUTOMATION_POLL_MS: ${AUTOMATION_POLL_MS:-60000}
      AUTOMATION_JOB_POLL_MS: ${AUTOMATION_JOB_POLL_MS:-5000}
      AUTOMATION_JOB_LEASE_MS: ${AUTOMATION_JOB_LEASE_MS:-600000}
      EVENT_POLL_MS: ${EVENT_POLL_MS:-5000}
      EVENT_LEASE_MS: ${EVENT_LEASE_MS:-120000}
      INTEGRATION_POLL_MS: ${INTEGRATION_POLL_MS:-5000}
      INTEGRATION_LEASE_MS: ${INTEGRATION_LEASE_MS:-120000}
      MAINTENANCE_TIMEZONE: ${MAINTENANCE_TIMEZONE:-Asia/Shanghai}
      MAINTENANCE_POLL_MS: ${MAINTENANCE_POLL_MS:-60000}
      MAINTENANCE_LEASE_MS: ${MAINTENANCE_LEASE_MS:-1800000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://101.200.45.180}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      TESSERACT_LANG: ${TESSERACT_LANG:-chi_sim+eng}
      OCR_THREAD_LIMIT: ${OCR_THREAD_LIMIT:-1}
      AGENT_RUNTIME: ${AGENT_RUNTIME:-claude-code}
      AGENT_FALLBACK_RUNTIME: ${AGENT_FALLBACK_RUNTIME:-legacy}
      CLAUDE_CODE_WORKDIR: /data/claude-workdir
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_USER_ACCESS_TOKEN: ${FEISHU_USER_ACCESS_TOKEN:-}
      FEISHU_DOMAIN: ${FEISHU_DOMAIN:-https://open.feishu.cn}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      LICENSE_TOKEN: ${LICENSE_TOKEN:-}
      LICENSE_DEPLOYMENT_ID: ${LICENSE_DEPLOYMENT_ID:-development}
      LICENSE_HOST: ${LICENSE_HOST:-http://localhost}
      LICENSE_ENFORCEMENT: ${LICENSE_ENFORCEMENT:-monitor}
    volumes:
      - backend-data:/data
    ports:
      - "127.0.0.1:4000:4000"
    mem_limit: 750m
    mem_reservation: 350m
    cpus: "0.75"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 350m
    mem_reservation: 150m
    cpus: "0.35"
    depends_on:
      - backend

volumes:
  backend-data:
